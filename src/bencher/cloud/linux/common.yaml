write_files:
  - path: /etc/salt/minion.d/bencher.conf
    content: |
      file_client: local
      file_roots:
        base:
          - /var/lib/bencher/states
          - /var/lib/bencher/runner/salt
      pillar_roots:
        base:
          - /var/lib/bencher/in/pillar
  - path: /etc/systemd/system/victoria-metrics.service.d/bencher.conf
    content: |
      [Service]
      Slice=bencher.slice
      ExecStart=
      ExecStart=/usr/bin/victoria-metrics -storageDataPath=/var/lib/victoria-metrics -httpListenAddr=:8428 -retentionPeriod=1d -loggerLevel=WARN
  - path: /etc/systemd/system/telegraf.service.d/bencher.conf
    content: |
      [Service]
      Slice=bencher.slice
      User=root
      ExecStart=
      ExecStart=/usr/bin/telegraf --config /var/lib/bencher/telegraf.conf
  - path: /etc/systemd/system/bencher.slice
    content: |
      [Unit]
      Description=bencher telemetry: Telegraf and VictoriaMetrics
  - path: /etc/systemd/system/bench.slice
    content: |
      [Unit]
      Description=bencher benchmark: the entrypoint and everything it starts

runcmd:
  - set -e
  - systemctl disable --now telegraf.service victoria-metrics.service
  - timeout 600 sh -c 'until [ -d /bencher/run/runner ]; do sleep 1; done'
  - rm -rf /var/lib/bencher && mkdir -p /var/lib/bencher && cp -a /bencher/run/. /var/lib/bencher/
  - set -- $(python3 -c 'import os; print(*sorted(os.sched_getaffinity(0)))')
  - '[ "$#" -ge 2 ] || { echo "bencher: telemetry fencing needs 2 CPUs, the instance has $#"; exit 1; }'
  - systemctl daemon-reload
  - systemctl set-property --runtime bencher.slice "AllowedCPUs=$1"
  - shift && systemctl set-property --runtime bench.slice "AllowedCPUs=$(echo "$@" | tr ' ' ',')"
  - if [ -f /var/lib/bencher/runner/salt/runner.sls ]; then salt-call --local --retcode-passthrough --state-output=changes state.apply runner; fi
  - salt-call --local --retcode-passthrough --state-output=changes state.apply bencher
