name: release

on:
  push:
    tags:
      - v*

permissions:
  contents: read

jobs:
  form:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        runner:
          - runner
          - vm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: version matches the tag
        run: |
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          [ "v$version" = "$GITHUB_REF_NAME" ]
      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
      - run: sudo ci/setup.sh "$USER"
      - run: sg incus-admin -c "ci/e2e.sh ${{ matrix.runner }} $RUNNER_TEMP/report.json"
        env:
          BENCHER_CACHE: ${{ runner.temp }}/cache
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: images-${{ matrix.runner }}
          path: ${{ runner.temp }}/cache/images/*.tar
          if-no-files-found: error
          compression-level: 0

  publish:
    needs: form
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: images-*
          merge-multiple: true
          path: images
      - name: manifest
        working-directory: images
        run: |
          sha256sum -- *.tar | jq -R 'split("  ") | {(.[1]): .[0]}' | jq -s add > manifest.json
          cat manifest.json
      - name: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" --verify-tag --generate-notes images/*.tar images/manifest.json
