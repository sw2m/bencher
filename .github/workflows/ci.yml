name: ci

on:
  pull_request:
    # No `opened`: a non-draft open would race draft-guard and fire CI once before
    # it re-drafts. CI runs when a draft is marked ready (ready_for_review) or on a
    # push (synchronize). Drafts are skipped below regardless.
    types:
      - synchronize
      - reopened
      - ready_for_review
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}-${{ github.event.pull_request.draft || false }}
  cancel-in-progress: true

jobs:
  check:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
      - uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('flake.nix', 'flake.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-
      - run: nix flake check --no-update-lock-file -L
      - run: nix run . -- lint ci/bench
      - run: '! nix run . -- lint ci/bench --set resolved=expect.tsv'

  run:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        runner:
          - runner
          - vm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
      - uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7
        with:
          primary-key: nix-run-${{ runner.os }}-${{ hashFiles('flake.nix', 'flake.lock') }}
          restore-prefixes-first-match: nix-run-${{ runner.os }}-
      - run: sudo ci/setup.sh "$USER"
      - run: sg incus-admin -c "ci/e2e.sh ${{ matrix.runner }} $RUNNER_TEMP/report.json"
      - run: sg incus-admin -c "ci/l1.sh ${{ matrix.runner }} $RUNNER_TEMP/l1 ${{ matrix.runner == 'runner' && 'corrupt' || '' }}"
      - if: matrix.runner == 'runner'
        run: sg incus-admin -c "ci/pair.sh runner $RUNNER_TEMP/pair"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: report-${{ matrix.runner }}
          path: |
            ${{ runner.temp }}/report.json
            ${{ runner.temp }}/l1/
            ${{ runner.temp }}/pair/
          if-no-files-found: warn

  action:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: formed
        uses: ./
        with:
          bench: ci/bench
      - run: '[ "${{ steps.formed.outputs.passed }}" = true ]'
      - run: sg incus-admin -c "incus image delete bencher/$(jq -r .cache.key '${{ steps.formed.outputs.report }}')"
      - id: cached
        uses: ./
        with:
          bench: ci/bench
      - run: '[ "${{ steps.cached.outputs.passed }}" = true ] && [ "${{ steps.cached.outputs.cache }}" = L2 ]'
      - id: primed
        uses: ./
        with:
          bench: ci/bench
          args: --set cache=provisioned
      - run: |
          [ "${{ steps.primed.outputs.passed }}" = true ]
          [ "$(jq -r '.cache.kind + " " + .cache.level + " " + .cache.base.level' '${{ steps.primed.outputs.report }}')" = "provisioned L0 L2" ]
      - run: sg incus-admin -c "incus image delete bencher/$(jq -r .cache.key '${{ steps.primed.outputs.report }}')"
      - id: provisioned
        uses: ./
        with:
          bench: ci/bench
          args: --set cache=provisioned
      - run: |
          [ "${{ steps.provisioned.outputs.passed }}" = true ]
          [ "$(jq -r '.cache.kind + " " + .cache.level + " " + (.cache.base.level // "null")' '${{ steps.provisioned.outputs.report }}')" = "provisioned L2 null" ]

  cache:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
      - uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7
        with:
          primary-key: nix-run-${{ runner.os }}-${{ hashFiles('flake.nix', 'flake.lock') }}
          restore-prefixes-first-match: nix-run-${{ runner.os }}-
      - run: sudo ci/setup.sh "$USER"
      - id: before
        uses: ./cache
        with:
          mode: restore
          bench: ci/bench
      - run: rm -rf ~/.cache/bencher/images/* # a cold run, whatever the restore found
      - run: sg incus-admin -c "ci/e2e.sh runner $RUNNER_TEMP/cold.json"
      - run: '[ "$(jq -r .cache.level "$RUNNER_TEMP/cold.json")" = L0 ]'
      - id: cold
        uses: ./cache
        with:
          mode: save
          report: ${{ runner.temp }}/cold.json
          key: ${{ steps.before.outputs.key }}
      - run: '[ "${{ steps.cold.outputs.changed }}" = true ]'
      - run: |
          sg incus-admin -c "incus image delete bencher/$(jq -r .cache.key "$RUNNER_TEMP/cold.json")"
          rm -rf ~/.cache/bencher/images/*
      - id: after
        uses: ./cache
        with:
          mode: restore
          bench: ci/bench
      - run: |
          [ "${{ steps.after.outputs.hit }}" = true ]
          [ "${{ steps.after.outputs.matched }}" = "${{ steps.before.outputs.key }}" ]
      - run: sg incus-admin -c "ci/e2e.sh runner $RUNNER_TEMP/warm.json"
      - run: '[ "$(jq -r .cache.level "$RUNNER_TEMP/warm.json")" = L2 ]'
      - id: warm
        uses: ./cache
        with:
          mode: save
          report: ${{ runner.temp }}/warm.json
          key: ${{ steps.after.outputs.key }}
      - run: '[ "${{ steps.warm.outputs.changed }}" = false ]'

  # The one status to mark required
  mergeable:
    needs:
      - check
      - run
      - action
      - cache
    if: always() # report on drafts too, so the status is never stuck "expected"
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "check=${{ needs.check.result }} run=${{ needs.run.result }} action=${{ needs.action.result }} cache=${{ needs.cache.result }}"
          [ "${{ needs.check.result }}" = success ]
          [ "${{ needs.run.result }}" = success ]
          [ "${{ needs.action.result }}" = success ]
          [ "${{ needs.cache.result }}" = success ]
